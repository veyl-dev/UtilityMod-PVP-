name: Build UtilityMod-PVP

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-26.3:
    name: Build Minecraft 26.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UtilityMod-PVP-Minecraft-26.3
          path: build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  build-26x-compat:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.2"
            loader: "0.19.3"
            fabric_api: "0.161.0+26.2"
            fabric_api_min: "0.161.0"
          - minecraft: "26.1.2"
            loader: "0.19.5"
            fabric_api: "0.155.3+26.1.2"
            fabric_api_min: "0.155.3"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build compatibility source
        working-directory: versions/26.1.2-26.2
        run: >
          gradle --no-daemon clean build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pfabric_api_min=${{ matrix.fabric_api_min }}
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UtilityMod-PVP-Minecraft-${{ matrix.minecraft }}
          path: versions/26.1.2-26.2/build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  build-26.1:
    name: Build Minecraft 26.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build 26.1 profile
        working-directory: versions/26.1
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UtilityMod-PVP-Minecraft-26.1
          path: versions/26.1/build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  build-legacy:
    name: Build Minecraft 1.21.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25 (Gradle runtime; Java 21 toolchain for Minecraft)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build legacy mod
        working-directory: versions/1.21.11
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UtilityMod-PVP-Minecraft-1.21.11
          path: versions/1.21.11/build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned JARs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-26.3, build-26x-compat, build-26.1, build-legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jar
          generate_release_notes: true
