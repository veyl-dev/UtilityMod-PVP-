name: Build UtilityMod-PVP

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-modern:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.3"
            loader: "0.20.1"
            fabric_api: "0.165.2+26.3"
            fabric_api_min: "0.165.2"
          - minecraft: "26.2"
            loader: "0.19.3"
            fabric_api: "0.161.0+26.2"
            fabric_api_min: "0.161.0"
          - minecraft: "26.1.2"
            loader: "0.19.5"
            fabric_api: "0.155.3+26.1.2"
            fabric_api_min: "0.155.3"
          - minecraft: "26.1"
            loader: "0.18.4"
            fabric_api: "0.143.11+26.1"
            fabric_api_min: "0.143.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build mod
        run: >
          gradle --no-daemon clean build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pminecraft_dependency=${{ matrix.minecraft }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pfabric_api_min=${{ matrix.fabric_api_min }}
          -Pjava_version=25
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UtilityMod-PVP-Minecraft-${{ matrix.minecraft }}
          path: build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  build-legacy:
    name: Build Minecraft 1.21.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build legacy mod
        working-directory: versions/1.21.11
        run: gradle --no-daemon clean build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: UtilityMod-PVP-Minecraft-1.21.11
          path: versions/1.21.11/build/libs/*-*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned JARs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-modern, build-legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Download all version artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.jar
          generate_release_notes: true
