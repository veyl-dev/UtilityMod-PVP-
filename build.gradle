plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.properties([
            version: project.version,
            minecraft_dependency: project.minecraft_dependency,
            loader_version: project.loader_version,
            fabric_api_min: project.fabric_api_min,
            java_version: project.java_version
    ])
    filesMatching("fabric.mod.json") {
        expand(
                version: project.version,
                minecraft_dependency: project.minecraft_dependency,
                loader_version: project.loader_version,
                fabric_api_min: project.fabric_api_min,
                java_version: project.java_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(project.java_version)
    options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
